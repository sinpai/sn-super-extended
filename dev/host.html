<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Super Extended – dev host</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: flex; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #eef0f3; }
      #editor-pane { flex: 1 1 60%; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid #d0d4da; background: #fff; }
      #editor-pane header { padding: 8px 12px; border-bottom: 1px solid #e3e5e8; font-weight: 600; display: flex; gap: 8px; align-items: center; }
      #editor-pane header .meta { font-weight: 400; color: #6b7280; }
      iframe { flex: 1; width: 100%; border: 0; background: transparent; }
      #panel { flex: 1 1 40%; min-width: 320px; display: flex; flex-direction: column; padding: 12px; gap: 8px; overflow: auto; }
      #panel h2 { font-size: 13px; margin: 8px 0 0; }
      .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
      button { font: inherit; padding: 4px 10px; border: 1px solid #c4c9d0; border-radius: 4px; background: #fff; cursor: pointer; }
      button:hover { background: #f3f4f6; }
      pre { margin: 0; padding: 8px; background: #fff; border: 1px solid #d0d4da; border-radius: 4px; white-space: pre-wrap; word-break: break-all; max-height: 40vh; overflow: auto; font-size: 11px; }
      #log { max-height: 20vh; }
    </style>
  </head>
  <body>
    <section id="editor-pane">
      <header>Standard Notes (simulated) <span class="meta" id="note-meta"></span></header>
      <iframe
        id="plugin"
        title="Super Extended"
        sandbox="allow-scripts allow-top-navigation-by-user-activation allow-popups allow-modals allow-forms allow-downloads"
      ></iframe>
    </section>
    <aside id="panel">
      <div class="buttons">
        <button id="toggle-lock">Toggle "Prevent editing"</button>
        <button id="remote-edit">Simulate edit from another device</button>
        <button id="rename">Rename note in app</button>
        <button id="switch-note">Switch note</button>
        <button id="load-markdown">Load Markdown note</button>
        <button id="toggle-theme">Toggle dark theme</button>
        <button id="reset">Reset notes</button>
      </div>
      <h2>Saved note text (what Standard Notes stores)</h2>
      <pre id="saved-text"></pre>
      <h2>preview_plain</h2>
      <pre id="saved-preview"></pre>
      <h2>Protocol log</h2>
      <pre id="log"></pre>
    </aside>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
